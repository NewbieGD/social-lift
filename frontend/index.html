<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#151D23" />
    <title>Социальный лифт</title>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="field">
          <div id="board">
            <canvas id="game"></canvas>
            <div id="hud">
              <div class="wallet">
                <span class="wallet-icon" aria-hidden="true"></span>
                <span id="score">0</span>
                <span id="combo" class="combo"></span>
              </div>
              <div class="hud-right">
                <span id="tier" class="tier"></span>
                <button id="pauseBtn" class="icon-btn">
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor" />
                    <rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor" />
                  </svg>
                </button>
              </div>
            </div>
            <div id="hint" class="hint"></div>
            <div id="toast" class="toast"></div>
            <button id="skipBtn" class="skip-btn" data-action="skipTutorial"></button>
          </div>
        </div>
        <div id="controls">
          <div id="buttons"></div>
        </div>
      </div>

      <div id="screens"></div>
      <div id="countdown" class="countdown" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
