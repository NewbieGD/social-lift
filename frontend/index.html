<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#151D23" />
    <title>Социальный лифт</title>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="field">
          <div id="board">
            <canvas id="game"></canvas>
            <div id="hud">
              <div class="wallet">
                <span class="wallet-icon" aria-hidden="true"></span>
                <span id="score">0</span>
                <span id="combo" class="combo"></span>
              </div>
              <div class="hud-right">
                <span id="tier" class="tier"></span>
                <button id="pauseBtn" class="icon-btn" aria-label="Пауза">
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor" />
                    <rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor" />
                  </svg>
                </button>
              </div>
            </div>
            <div id="hint" class="hint"></div>
            <div id="toast" class="toast"></div>
          </div>
        </div>
        <div id="controls">
          <div id="buttons"></div>
        </div>
      </div>

      <div id="startScreen" class="overlay">
        <div class="panel">
          <h1 id="startTitle"></h1>
          <p id="startLead"></p>
          <p id="startControls" class="muted"></p>
          <p id="startRed" class="muted"></p>
          <div class="controls-picker"></div>
          <button id="startBtn" class="primary"></button>
          <p id="protoNote" class="note"></p>
        </div>
      </div>

      <div id="pauseScreen" class="overlay hidden">
        <div class="panel">
          <h2>Пауза</h2>
          <div class="controls-picker"></div>
          <button id="resumeBtn" class="primary">Продолжить</button>
          <button id="restartBtn" class="secondary">Начать заново</button>
        </div>
      </div>

      <div id="resultScreen" class="overlay hidden">
        <div class="panel">
          <p class="muted" id="resultReason"></p>
          <p class="headline-label" id="resultLabel"></p>
          <h2 id="resultTier"></h2>
          <div class="big-score" id="resultScore">0</div>
          <div class="record hidden" id="resultRecord"></div>
          <dl class="stats" id="resultStats"></dl>
          <button id="againBtn" class="primary"></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
