<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#151D23" />
    <title>Социальный лифт</title>
  </head>
  <body>
    <canvas id="backdrop" aria-hidden="true"></canvas>
    <div id="app">
      <div id="stage">
        <div id="field">
          <div id="board">
            <canvas id="game"></canvas>
            <div id="edgeGlow" class="edge-glow" aria-hidden="true"></div>
            <div id="hud">
              <div class="wallet">
                <span id="walletIcon" class="wallet-icon" aria-hidden="true"></span>
                <span id="score">0</span>
                <span class="combo-wrap">
                  <span id="combo" class="combo"></span>
                  <span class="combo-timer" aria-hidden="true"><i id="comboBar"></i></span>
                  <span id="shatter" class="shatter" aria-hidden="true"></span>
                </span>
                <span id="bonus" class="bonus-chip"></span>
              </div>
              <div class="hud-right">
                <span id="tier" class="tier"></span>
                <button id="pauseBtn" class="icon-btn">
                  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                    <rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor" />
                    <rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor" />
                  </svg>
                </button>
              </div>
            </div>
            <div id="duelBar" class="duel-bar" aria-live="off">
              <div class="duel-side me"><small>Вы</small><b id="duelMe">0</b></div>
              <div class="duel-vs">:</div>
              <div class="duel-side opp"><b id="duelOpp">0</b><small id="duelOppName"></small></div>
            </div>
            <div id="hint" class="hint"></div>
            <div id="tutCard" class="tut" aria-live="polite"></div>
            <div id="toast" class="toast"></div>
            <div id="press" class="press" aria-hidden="true"></div>
            <div id="floor" class="floor" aria-hidden="true"></div>
            <div id="caption" class="caption" aria-live="polite"></div>
            <div id="oppWrap" class="opp" aria-hidden="true">
              <canvas id="opp"></canvas>
              <div class="opp-label"><span id="oppName"></span></div>
            </div>
            <button id="skipBtn" class="skip-btn" data-action="skipTutorial"></button>
          </div>
        </div>
        <div id="controls">
          <div id="buttons"></div>
        </div>
      </div>

      <div id="screens"></div>
      <div id="countdown" class="countdown" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
